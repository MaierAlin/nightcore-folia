name: Build nightcore
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build
        run: mvn clean package -B
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: nightcore
          path: "**/target/*.jar"
          retention-days: 30
